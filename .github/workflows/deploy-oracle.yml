name: Deploy Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          test -n "$ORACLE_SSH_KEY_B64"
          echo "$ORACLE_SSH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/oracle.key"
          chmod 600 "$RUNNER_TEMP/oracle.key"

      - name: Deploy on Oracle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key_path: ${{ runner.temp }}/oracle.key
          script_stop: true
          script: |
            set -e
            cd ~/pure-promemoria-deploy/app
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            cd ~/pure-promemoria-deploy
            sudo docker compose -f backend/docker-compose.yml up -d --force-recreate web
            echo "Deploy Oracle completato"
